name: Build APK
description: Builds one APK of Rust Client with Gradle (the steps shared by the jobs of build.yml)

inputs:
  arch:
    description: "all, arm, arm64, x86 or x86_64"
    required: true
  variant:
    description: "Debug or Release"
    required: true

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        add-job-summary: "on-failure"

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

    - name: Cache Rust build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          PetLib/rust/target
        key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
        restore-keys: petlib-rust-${{ runner.os }}-

    - name: Install cargo-ndk
      shell: bash
      run: |
        version="4.1.2"
        curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
          tar xz -C "$HOME/.cargo/bin" --strip-components=1
        chmod +x "$HOME/.cargo/bin"/cargo-ndk*
        cargo ndk --version

    - name: Setup Android NDK
      shell: bash
      run: |
        ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
        if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
          sdkmanager --install "ndk;27.0.12077973"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
        fi
        echo "Using NDK at $ndk"
        test -f "$ndk/source.properties"
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

    - name: Build APK for ${{ inputs.arch }}
      shell: bash
      run: |
        chmod +x gradlew
        ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ inputs.arch }}

    - name: Upload Release APK for ${{ inputs.arch }}
      if: inputs.variant == 'Release'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: release apk (${{ inputs.arch }})
        path: ZalithLauncher/build/outputs/apk/release/*.apk

    - name: Upload Release Mapping for ${{ inputs.arch }}
      if: inputs.variant == 'Release'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: mapping (${{ inputs.arch }})
        path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

    - name: Upload Debug APK for ${{ inputs.arch }}
      if: inputs.variant == 'Debug'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: debug apk (${{ inputs.arch }})
        path: ZalithLauncher/build/outputs/apk/debug/*.apk

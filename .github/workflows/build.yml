name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (Release produces an UNSIGNED apk, see docs/SIGNING.md)"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

# [Rust Client]
# The Rust Edition engine (RustEngine/) is ARM64 only and takes long to compile, so it is built
# once by the "engine" job and cached; the "build-rust" job packages it into the arm64 and the
# universal APK. The other architectures ("build") do not wait for it and carry no engine.
# If the engine job fails, build-rust still builds its APKs (without the Rust Edition) so that
# the launcher itself keeps being verified; the failed engine job keeps the run red.
jobs:
  engine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust Client: every built-in mod, X-Ray, Trigger Bot.
          - variant: full
            profile: fast
            key: fast
          # Rust Client Lite: the survival mods, Auto Sprint only, and the "release" profile
          # (thin LTO, one codegen unit: the fastest game, the longest build). If that does
          # not fit the runner the step falls back to "fast", so the app is still built.
          - variant: lite
            profile: release
            key: lite
    env:
      ENGINE_ABI: arm64-v8a
      ENGINE_VARIANT: ${{ matrix.variant }}
      # "fast" is the profile upstream's releases are built with: the whole game optimized
      # (opt-level 3). "quick" builds the game's own code at opt-level 1, which plays slower.
      # It needs more memory than a runner has: hence the swap below.
      ENGINE_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore the built engine
        id: prebuilt
        uses: actions/cache@v4
        with:
          path: RustEngine/prebuilt
          key: rust-engine-${{ env.ENGINE_ABI }}-${{ matrix.key }}-${{ hashFiles('RustEngine/engine.lock', 'RustEngine/patches/**', 'RustEngine/tools/**') }}

      - name: Make room (the build with the built-in mods needs about 25 GB) and add swap
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo fallocate -l 14G /swap-engine && sudo chmod 600 /swap-engine && sudo mkswap /swap-engine \
            && sudo swapon /swap-engine || echo "::warning::no extra swap"

      - name: Set up JDK 25 (the engine compiles its data exporters with it)
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Install the NDK upstream pins
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Fetch and patch the engine source
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: python3 RustEngine/tools/build_engine.py --fetch-only

      - name: Cache the engine's Cargo build
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ~/.cache/starling-native/build-arm64-v8a -> target
          shared-key: rust-engine-mods-${{ env.ENGINE_ABI }}-${{ env.ENGINE_PROFILE }}
          cache-on-failure: true

      - name: Build the engine
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          build() { python3 RustEngine/tools/build_engine.py --abi "$ENGINE_ABI" --variant "$ENGINE_VARIANT" --profile "$1"; }
          if [ "$ENGINE_PROFILE" = "fast" ]; then
            build fast
          elif ! timeout -k 30 100m bash -c "$(declare -f build); build $ENGINE_PROFILE"; then
            echo "::warning::The $ENGINE_PROFILE profile did not build on this runner; building $ENGINE_VARIANT with the fast profile instead."
            pkill -9 -x cargo || true; pkill -9 -x rustc || true; sleep 5
            rm -rf RustEngine/prebuilt
            find ~/.cache/starling-native -maxdepth 4 -type d -name "$ENGINE_PROFILE" -exec rm -rf {} + || true
            build fast
          fi

      # No artifact: the account's artifact storage is limited. The cache step above saves
      # RustEngine/prebuilt when this job ends, and build-rust restores it by the same key.
      - name: Check the engine
        run: test -f RustEngine/prebuilt/engine.json

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["arm", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build-apk
        with:
          arch: ${{ matrix.arch }}
          variant: ${{ inputs.variant }}
          token: ${{ github.token }}

  build-rust:
    needs: engine
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["all", "arm64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore the built engine
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: RustEngine/prebuilt
          key: rust-engine-arm64-v8a-fast-${{ hashFiles('RustEngine/engine.lock', 'RustEngine/patches/**', 'RustEngine/tools/**') }}

      - name: Show the engine
        run: |
          if [ -f RustEngine/prebuilt/engine.json ]; then
            cat RustEngine/prebuilt/engine.json
            find RustEngine/prebuilt -type f -printf '%10s  %p\n'
          else
            echo "::warning::The Rust Edition engine was not built; this APK has no Rust Edition."
          fi

      - name: Build
        uses: ./.github/actions/build-apk
        with:
          arch: ${{ matrix.arch }}
          variant: ${{ inputs.variant }}
          token: ${{ github.token }}

  # Rust Client Lite: a second app with the Rust Edition only (ARM64, like its engine).
  build-lite:
    needs: engine
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore the built engine
        uses: actions/cache/restore@v4
        with:
          path: RustEngine/prebuilt
          key: rust-engine-arm64-v8a-lite-${{ hashFiles('RustEngine/engine.lock', 'RustEngine/patches/**', 'RustEngine/tools/**') }}
          fail-on-cache-miss: true

      - name: Show the engine
        run: |
          cat RustEngine/prebuilt/engine.json
          grep -q '"variant": "lite"' RustEngine/prebuilt/engine.json

      - name: Build
        uses: ./.github/actions/build-apk
        with:
          arch: arm64
          app: lite
          variant: ${{ inputs.variant }}
          token: ${{ github.token }}

name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (Release produces an UNSIGNED apk, see docs/SIGNING.md)"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

# [Rust Client]
# The Rust Edition engine (RustEngine/) is ARM64 only and takes long to compile, so it is built
# once by the "engine" job and cached; the "build-rust" job packages it into the arm64 and the
# universal APK. The other architectures ("build") do not wait for it and carry no engine.
# If the engine job fails, build-rust still builds its APKs (without the Rust Edition) so that
# the launcher itself keeps being verified; the failed engine job keeps the run red.
jobs:
  engine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ENGINE_ABI: arm64-v8a
      # "quick" is what upstream builds outside of releases. "fast" (upstream's release
      # profile) needs more memory than a 16 GB runner has without swap.
      ENGINE_PROFILE: quick
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore the built engine
        id: prebuilt
        uses: actions/cache@v4
        with:
          path: RustEngine/prebuilt
          key: rust-engine-${{ env.ENGINE_ABI }}-${{ env.ENGINE_PROFILE }}-${{ hashFiles('RustEngine/engine.lock', 'RustEngine/patches/**', 'RustEngine/tools/**') }}

      - name: Set up JDK 25 (the engine compiles its data exporters with it)
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Install the NDK upstream pins
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Fetch and patch the engine source
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: python3 RustEngine/tools/build_engine.py --fetch-only

      - name: Cache the engine's Cargo build
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustEngine/.engine-src -> target
          shared-key: rust-engine-${{ env.ENGINE_ABI }}-${{ env.ENGINE_PROFILE }}
          cache-on-failure: true

      - name: Build the engine
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: python3 RustEngine/tools/build_engine.py --abi "$ENGINE_ABI" --profile "$ENGINE_PROFILE"

      # No artifact: the account's artifact storage is limited. The cache step above saves
      # RustEngine/prebuilt when this job ends, and build-rust restores it by the same key.
      - name: Check the engine
        run: test -f RustEngine/prebuilt/engine.json

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["arm", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build-apk
        with:
          arch: ${{ matrix.arch }}
          variant: ${{ inputs.variant }}
          token: ${{ github.token }}

  build-rust:
    needs: engine
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["all", "arm64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore the built engine
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: RustEngine/prebuilt
          key: rust-engine-arm64-v8a-quick-${{ hashFiles('RustEngine/engine.lock', 'RustEngine/patches/**', 'RustEngine/tools/**') }}

      - name: Show the engine
        run: |
          if [ -f RustEngine/prebuilt/engine.json ]; then
            cat RustEngine/prebuilt/engine.json
            find RustEngine/prebuilt -type f -printf '%10s  %p\n'
          else
            echo "::warning::The Rust Edition engine was not built; this APK has no Rust Edition."
          fi

      - name: Build
        uses: ./.github/actions/build-apk
        with:
          arch: ${{ matrix.arch }}
          variant: ${{ inputs.variant }}
          token: ${{ github.token }}

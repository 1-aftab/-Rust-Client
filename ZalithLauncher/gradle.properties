# launcher name & url
# Rust Client is an unofficial modified version of Zalith Launcher 2 (GPL-3.0).
# Per the upstream additional terms, the name must not contain "ZalithLauncher" or "ZL".
launcher_name=RustClient
launcher_app_name=Rust Client
launcher_short_name=RC
url_home=https://github.com/1-aftab/-Rust-Client

# Android application id (install identity). Kept separate from the Kotlin/Java
# namespace (com.movtery.zalithlauncher) so Rust Client installs alongside the
# upstream launcher instead of colliding with it. Change this to an id you own
# before publishing; changing it later makes Android treat the app as a new install.
launcher_application_id=io.github.aftab1.rustclient

# URL of the "latest version" JSON used by the in-app update checker
# (same format as upstream's latest_version_md.json, served via the GitHub contents API).
# Leave empty to disable the update checker. It must NOT point at upstream's feed:
# that would offer upstream APKs, which cannot update this app.
upgrade_info_url=

# your OAuth client id
#oauth_client_id=xxx

# your CurseForge API key
#curseforge_api_key=xxx

# default key, please add it yourself.
default_store_password=vh#nn%N(#eNjwfA78-77s6&f-cdd(@-7eana-e%!nhj%))!@c
default_key_password=sfv72ghSSNQaadf99-Q69!2

# launcher version
launcher_version_code=200049
launcher_version_name=2.8.2